[workspace]
members = [
    "crates/shared",
    "crates/detector",
    "crates/frontend",
]
# frontend is wasm32-only — exclude from native cargo test/build
default-members = [
    "crates/shared",
    "crates/detector",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# shared
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"

# backend
tokio = { version = "1.52", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# image processing
image = "0.25"
imageproc = "0.27"

# random
rand = "0.10"

# testing
proptest = "1.11"
