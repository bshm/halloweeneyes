[build]
target = "index.html"
dist = "dist"
public_url = "/"

[watch]
ignore = ["dist"]

# Dev-mode proxies
# /log  — forward frontend diagnostic logs to the detector (HTTP)
# /ws   — WebSocket proxy; use http:// scheme, trunk handles the upgrade
[[proxy]]
backend = "http://localhost:8080/log"

[[proxy]]
backend = "http://localhost:8080/ws"
