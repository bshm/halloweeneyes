<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>eye calibration</title>
<style>
  body { background:#111; color:#ddd; font:13px/1.4 monospace; margin:12px; }
  #wrap { position:relative; display:inline-block; }
  img { width:640px; height:480px; image-rendering:pixelated; border:1px solid #444; }
  #mark { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px;
          border:1px solid #f33; border-radius:50%; display:none; pointer-events:none; }
  .row { margin:6px 0; }
  input { width:70px; background:#000; color:#0f0; border:1px solid #444; }
  button { background:#222; color:#ddd; border:1px solid #555; padding:4px 10px; }
  #log { white-space:pre; color:#0f0; margin-top:8px; }
</style>
</head>
<body>
<div id="wrap"><img id="frame" src="/frame.jpg"><div id="mark"></div></div>
<div class="row">click the frame at a known point, then enter the eye coords it should map to</div>
<div class="row">camera px: <input id="cx" readonly> <input id="cy" readonly>
  &nbsp; eye: <input id="ex" value="0"> <input id="ey" value="0">
  &nbsp; <button onclick="addSample()">add sample</button></div>
<div class="row"><button onclick="fit()">fit &amp; apply</button>
  <button onclick="reset()">reset to defaults</button>
  <button onclick="state()">show state</button>
  <span id="count"></span></div>
<div id="log"></div>
<script>
const W=320,H=240;
const img=document.getElementById('frame');
function refresh(){ img.src='/frame.jpg?t='+Date.now(); }
setInterval(refresh, 500); refresh();

img.addEventListener('click', e=>{
  const r=img.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  document.getElementById('cx').value=x.toFixed(1);
  document.getElementById('cy').value=y.toFixed(1);
  const m=document.getElementById('mark');
  m.style.display='block';
  m.style.left=(e.clientX-r.left)+'px'; m.style.top=(e.clientY-r.top)+'px';
});

async function post(url, body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const t=await r.text(); document.getElementById('log').textContent=t; return t;
}
function addSample(){
  post('/calib/sample',{camera:[+cx.value,+cy.value],eye:[+ex.value,+ey.value]});
  setTimeout(state,200);
}
function fit(){ post('/calib/fit'); }
function reset(){ post('/calib/reset'); }
async function state(){
  const r=await fetch('/calib/state'); const j=await r.json();
  document.getElementById('count').textContent='samples: '+j.samples;
}
state();
</script>
</body>
</html>
